# Local checks before each commit: `pip install pre-commit && pre-commit install`.
# CI runs the same ruff rules (upstream ci.yml) and gitleaks (sid-ci.yml), so
# skipping these locally only moves the failure to the pull request.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
