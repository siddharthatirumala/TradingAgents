# SID Trading Firm built-in defaults: the lowest-priority configuration source.
#
# Override in your own YAML file (SID_CONFIG_FILE or load_settings(config_file=...))
# or with environment variables: SID_<GROUP>__<FIELD>, for example
#   SID_BUDGETS__MAX_AI_COST_PER_RUN_USD=2.50
#   SID_MODELS__TIERS__DEEP__PROVIDER=openai
#   SID_MODELS__TIERS__DEEP__MODEL=gpt-6-sol
# Precedence: explicit arguments > environment > .env > your YAML file > this file.

app:
  name: SID Trading Firm
  environment: development
  market_scope: us_equities
  live_trading_enabled: false   # cannot be enabled: validation rejects true

models:
  # Logical tiers. Each names its own provider, so tiers can mix providers.
  # max_output_tokens bounds every call's worst-case cost; without it some
  # providers default to very large caps (Anthropic: 128k output tokens).
  tiers:
    fast:
      provider: openai
      model: gpt-6-luna
      max_output_tokens: 8192
    standard:
      provider: anthropic
      model: claude-sonnet-5-5
      max_output_tokens: 8192
    deep:
      provider: anthropic
      model: claude-sonnet-5-5
      max_output_tokens: 8192
  # Agent id -> tier. Every agent that calls a model must be listed.
  agents:
    technical_analyst: standard
    fundamentals_analyst: standard
    news_analyst: standard
    macro_analyst: standard
    market_regime_analyst: standard
    sentiment_analyst: fast
    bull_researcher: standard
    bear_researcher: standard
    quant_validator: standard
    trader: standard
    aggressive_risk_analyst: standard
    conservative_risk_analyst: standard
    neutral_risk_analyst: standard
    risk_manager: standard
    research_manager: deep
    portfolio_manager: deep
    cio: deep
    reflector: fast
    extractor: fast

# Spending and effort caps. Placeholders until the baseline measurement; every
# cap is finite and enforced before each model call (fail closed).
budgets:
  max_ai_cost_per_run_usd: 3.00
  max_ai_cost_per_day_usd: 10.00
  max_ai_cost_total_usd: 30.00     # lifetime Phase 1B measurement ceiling (owner, 2026-10-08); code caps it at 30
  max_llm_tokens_per_agent: 300000
  max_agent_iterations: 12
  max_debate_rounds: 1
  max_risk_discuss_rounds: 1
  max_ai_candidates_per_run: 5     # screening cap (Phase 3); placeholder
  output_token_reserve: 4096
  allow_unpriced_models: false

# Hard-risk placeholders. Deliberately unset: the hard risk engine (later phase)
# rejects every proposal while any of these is missing.
risk:
  max_position_pct: null
  max_daily_loss_pct: null
  max_drawdown_pct: null
  max_sector_exposure_pct: null
  max_open_positions: null
  max_trades_per_day: null
  min_avg_daily_volume: null
  max_data_age_seconds: null
  allowed_instruments: null
  max_order_notional: null
  policy_version: null

# Phase 1B research (zero-spend). Off by default; enabling it requires every value
# below. Only mocked models are allowed.
research:
  enabled: false
  model_mode: mock
  max_news_items_per_instrument: null
  freshness:
    prices_max_age_trading_days: null
    fundamentals_max_age_days: null
    news_window_hours: null
    news_min_items: null
    macro_max_age_days: null

database:
  url: null        # set SID_DATABASE__URL in .env
  echo: false

logging:
  level: INFO
  format: json
